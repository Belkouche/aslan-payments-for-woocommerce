name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # persist-credentials left at default per release spec (publish job needs credentialed checkout)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          tools: composer, wp-cli
      - name: Install dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction
      - name: Regenerate POT
        run: wp i18n make-pot . languages/aslan-payments-for-woocommerce.pot --slug=aslan-payments-for-woocommerce --domain=aslan-payments-for-woocommerce
      - name: Build ZIP
        run: |
          mkdir -p build/aslan-payments-for-woocommerce
          rsync -a --exclude='tests' --exclude='docker' --exclude='docs' --exclude='.git*' --exclude='node_modules' --exclude='build' --exclude='package*.json' ./ build/aslan-payments-for-woocommerce/
          cd build && zip -r ../aslan-payments-for-woocommerce.zip aslan-payments-for-woocommerce
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: aslan-payments-for-woocommerce.zip
      - name: Deploy to wordpress.org
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        env:
          SVN_USERNAME: ${{ secrets.WPORG_USERNAME }}
          SVN_PASSWORD: ${{ secrets.WPORG_PASSWORD }}
          SLUG: aslan-payments-for-woocommerce
          BUILD_DIR: build/aslan-payments-for-woocommerce
