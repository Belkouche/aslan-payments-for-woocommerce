name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2.35', '8.3.36', '8.4.27', '8.5.12']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Install dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
        run: composer install --no-interaction --no-progress --no-ansi --prefer-dist
      - run: composer test -- --testsuite unit
      - run: composer analyse
      - name: Verify phpcs standards are registered
        run: vendor/bin/phpcs -i | tee /dev/stderr | grep -q WordPress
      - run: composer lint
